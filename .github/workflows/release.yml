# Release workflow for KindlyGuard
# This is a manually created workflow based on cargo-dist configuration
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v*.*.*

jobs:
  # Build and package all the things
  build:
    strategy:
      matrix:
        include:
          # Linux builds
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            dist-args: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            dist-args: ""
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            dist-args: ""
            use-cross: true
          
          # macOS builds
          - target: aarch64-apple-darwin
            os: macos-latest
            dist-args: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            dist-args: ""
          
          # Windows builds
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            dist-args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross for cross-compilation
        if: matrix.use-cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      
      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Build release binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../kindly-guard-${{ matrix.target }}.tar.gz \
            kindlyguard
        shell: bash
      
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target\${{ matrix.target }}\release
          Compress-Archive -Path kindlyguard.exe -DestinationPath ..\..\..\kindly-guard-${{ matrix.target }}.zip
        shell: pwsh
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindly-guard-${{ matrix.target }}
          path: |
            kindly-guard-*.tar.gz
            kindly-guard-*.zip

  # Create GitHub release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: true
          prerelease: false
      
      - name: Upload Release Assets
        run: |
          for file in artifacts/*/*.{tar.gz,zip}; do
            if [ -f "$file" ]; then
              asset_name=$(basename "$file")
              echo "Uploading $asset_name"
              gh release upload ${{ github.ref_name }} "$file" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generate shell installer
  shell-installer:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate shell installer
        run: |
          cat > install.sh << 'EOF'
          #!/bin/sh
          set -e
          
          # Detect OS and architecture
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          
          case "$OS" in
            linux)
              case "$ARCH" in
                x86_64) TARGET="x86_64-unknown-linux-gnu" ;;
                aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
                *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
              esac
              ;;
            darwin)
              case "$ARCH" in
                x86_64) TARGET="x86_64-apple-darwin" ;;
                arm64) TARGET="aarch64-apple-darwin" ;;
                *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
              esac
              ;;
            *) echo "Unsupported OS: $OS"; exit 1 ;;
          esac
          
          # Download and install
          VERSION="${1:-latest}"
          if [ "$VERSION" = "latest" ]; then
            URL="https://github.com/kindly-software-inc/kindly-guard/releases/latest/download/kindly-guard-$TARGET.tar.gz"
          else
            URL="https://github.com/kindly-software-inc/kindly-guard/releases/download/$VERSION/kindly-guard-$TARGET.tar.gz"
          fi
          
          echo "Downloading KindlyGuard for $TARGET..."
          curl -L "$URL" | tar xz
          
          # Install to /usr/local/bin or ~/.local/bin
          if [ -w /usr/local/bin ]; then
            INSTALL_DIR=/usr/local/bin
          else
            INSTALL_DIR=$HOME/.local/bin
            mkdir -p "$INSTALL_DIR"
          fi
          
          mv kindly-guard* "$INSTALL_DIR/"
          echo "KindlyGuard installed to $INSTALL_DIR"
          EOF
          
          chmod +x install.sh
      
      - name: Upload shell installer
        run: |
          gh release upload ${{ github.ref_name }} install.sh --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generate PowerShell installer
  powershell-installer:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate PowerShell installer
        run: |
          cat > install.ps1 << 'EOF'
          # PowerShell installer for KindlyGuard
          $ErrorActionPreference = 'Stop'
          
          $version = if ($args.Count -eq 0) { "latest" } else { $args[0] }
          $target = "x86_64-pc-windows-msvc"
          
          if ($version -eq "latest") {
              $url = "https://github.com/kindly-software-inc/kindly-guard/releases/latest/download/kindly-guard-$target.zip"
          } else {
              $url = "https://github.com/kindly-software-inc/kindly-guard/releases/download/$version/kindly-guard-$target.zip"
          }
          
          Write-Host "Downloading KindlyGuard for Windows..."
          $tempFile = [System.IO.Path]::GetTempFileName() + ".zip"
          Invoke-WebRequest -Uri $url -OutFile $tempFile
          
          $installDir = "$env:LOCALAPPDATA\KindlyGuard"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          
          Write-Host "Extracting..."
          Expand-Archive -Path $tempFile -DestinationPath $installDir -Force
          Remove-Item $tempFile
          
          # Add to PATH
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($path -notlike "*$installDir*") {
              [Environment]::SetEnvironmentVariable("Path", "$path;$installDir", "User")
              Write-Host "Added $installDir to PATH"
          }
          
          Write-Host "KindlyGuard installed successfully!"
          EOF
      
      - name: Upload PowerShell installer
        run: |
          gh release upload ${{ github.ref_name }} install.ps1 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}