name: Parallel CI/CD

on:
  push:
    tags:
      - 'v*.*.*'  # Run on version tags
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  
jobs:
  # Matrix strategy for parallel execution
  build-matrix:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            
          # macOS targets
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            
          # Windows targets
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}
      
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5
      
      - name: Build
        run: |
          ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }} --all-features
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindlyguard-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kindlyguard*
            !target/**/*.d
            !target/**/*.rlib

  # Parallel test execution
  test-matrix:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - integration
          - doc
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install nextest
        uses: taiki-e/install-action@nextest
        
      - name: Run ${{ matrix.suite }} tests
        run: |
          case "${{ matrix.suite }}" in
            unit)
              cargo nextest run --lib
              ;;
            integration)
              cargo nextest run --test '*'
              ;;
            doc)
              cargo test --doc
              ;;
          esac

  # Security scanning in parallel
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install security tools
        run: |
          cargo install cargo-audit --version 0.18.3
          cargo install cargo-deny --version 0.14.24
      
      - name: Run cargo audit
        run: cargo audit --json > audit.json
        continue-on-error: true
      
      - name: Run cargo deny
        run: cargo deny check --format json > deny.json
        continue-on-error: true
      
      - name: Generate SARIF
        run: |
          # Convert security findings to SARIF format
          # This would use the xtask command in production
          echo '{"version":"2.1.0","runs":[]}' > security.sarif
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security.sarif
        continue-on-error: true

  # Format and lint checks
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  # Coverage generation
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # Final status check
  ci-success:
    name: CI Success
    if: success()
    needs:
      - build-matrix
      - test-matrix
      - security
      - lint
      - coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: CI completed successfully
        run: |
          echo "✅ All CI checks passed!"
          echo "Build artifacts are available in the Actions artifacts"