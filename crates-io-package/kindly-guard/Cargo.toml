[package]
name = "kindly-guard"
version = "0.15.0"
authors = ["samduchaine"]
edition = "2021"
description = "Security-focused MCP server for AI protection - the actual KindlyGuard server"
license = "Apache-2.0"
repository = "https://github.com/samduchaine/kindly-guard"
homepage = "https://github.com/samduchaine/kindly-guard"
documentation = "https://docs.rs/kindly-guard"
readme = "README.md"
keywords = ["security", "mcp", "ai", "protection", "unicode"]
categories = ["network-programming", "web-programming", "command-line-utilities"]

[[bin]]
name = "kindly-guard"
path = "src/main.rs"

[dependencies]
kindly-guard-server = { version = "0.11.14" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.46", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
