[package]
name = "kindly-guard"
version = "0.11.14"
authors = ["samduchaine"]
edition = "2021"
description = "Security-focused MCP server for AI protection - installer for the KindlyGuard binary"
license = "Apache-2.0"
repository = "https://github.com/samduchaine/kindly-guard"
homepage = "https://github.com/samduchaine/kindly-guard"
documentation = "https://docs.rs/kindly-guard"
readme = "README.md"
keywords = ["security", "mcp", "ai", "protection", "unicode"]
categories = ["network-programming", "web-programming", "command-line-utilities"]

[[bin]]
name = "kindly-guard"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
flate2 = "1.0"
tar = "0.4"
dirs = "5.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
