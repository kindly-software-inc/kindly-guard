# KindlyGuard rustfmt configuration
# Conservative formatting for security-focused code review
# 
# NOTE: This configuration only includes options that work with stable Rust.
# Unstable options have been commented out to avoid warnings.

# Edition - this is stable
edition = "2021"
# version = "Two"  # UNSTABLE: removed

# Line width - 100 chars for complex security expressions
max_width = 100
# error_on_line_overflow = false  # UNSTABLE: removed
# error_on_unformatted = false  # UNSTABLE: removed

# Import formatting - critical for security review
# imports_granularity = "Module"  # UNSTABLE: removed
# imports_layout = "HorizontalVertical"  # UNSTABLE: removed
# group_imports = "StdExternalCrate"  # UNSTABLE: removed
# imports_indent = "Block"  # UNSTABLE: removed
reorder_imports = true
reorder_modules = true

# Keep code readable and reviewable
# Avoid cramming too much on one line
use_small_heuristics = "Default"
# Explicit rather than implicit
use_field_init_shorthand = false
# force_multiline_blocks = true  # UNSTABLE: removed
# space_after_colon = true  # UNSTABLE: removed
# space_before_colon = false  # UNSTABLE: removed

# Match arms should be clear
# match_arm_blocks = true  # UNSTABLE: removed
match_block_trailing_comma = true
# overflow_delimited_expr = true  # UNSTABLE: removed

# Function formatting for reviewability
fn_params_layout = "Tall"  # One param per line when many
# fn_single_line = false  # UNSTABLE: removed

# Chain formatting - security code often has long error chains
chain_width = 60  # Force chains to wrap for readability
# indent_style = "Block"  # UNSTABLE: removed

# Struct formatting
# struct_field_align_threshold = 0  # UNSTABLE: removed
# Explicit is better for security review
use_try_shorthand = false

# Comment formatting
# normalize_comments = false  # UNSTABLE: removed
# wrap_comments = true  # UNSTABLE: removed
# comment_width = 80  # UNSTABLE: removed
# format_code_in_doc_comments = true  # UNSTABLE: removed

# String formatting
# format_strings = false  # UNSTABLE: removed
# format_macro_matchers = true  # UNSTABLE: removed
# format_macro_bodies = true  # UNSTABLE: removed

# Misc readability
# blank_lines_upper_bound = 2  # UNSTABLE: removed
# blank_lines_lower_bound = 0  # UNSTABLE: removed
# trailing_comma = "Vertical"  # UNSTABLE: removed
# trailing_semicolon = true  # UNSTABLE: removed
# inline_attribute_width = 0  # UNSTABLE: removed

# Don't hide complexity
# combine_control_expr = false  # UNSTABLE: removed

# Binary operator formatting
# binop_separator = "Front"  # UNSTABLE: removed

# Where clause formatting - keep generic bounds clear
# brace_style = "SameLineWhere"  # UNSTABLE: removed
# where_single_line = false  # UNSTABLE: removed

# Don't format generated code
# format_generated_files = false  # UNSTABLE: removed

# Keep TODO/FIXME visible
# report_todo = "Always"  # UNKNOWN: removed
# report_fixme = "Always"  # UNKNOWN: removed

# Don't hide control flow
# control_brace_style = "AlwaysSameLine"  # UNSTABLE: removed

# Make unsafe blocks highly visible
# (rustfmt doesn't have this directly, but our style helps)

# License header formatting
# license_template_path = ""  # UNKNOWN: removed