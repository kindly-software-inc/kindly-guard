[server]
bind = "127.0.0.1:8080"
workers = 4

[scanner]
scan_json_values = true
scan_json_keys = true
max_depth = 10
strict_mode = true

[quarantine]
base_path = "/tmp/kindlyguard_quarantine"
encrypt = true
compress_after_days = 30
delete_after_days = 90
max_size_mb = 1000

[neutralizer]
mode = "Automatic"
confidence_threshold = 0.7
backup_originals = true

[shield]
enable_stats = true
refresh_rate = 100